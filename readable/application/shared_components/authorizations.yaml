- # ====== Authorization: IS_ADMIN =============================
  id: 767807182572611
  identification: 
    name: IS_ADMIN

  subscription: 
    version-number: 5462293

  authorization-scheme: 
    type: PL/SQL Function Returning Boolean

  settings: 
    pl/sql-function-body: |
      RETURN HR.INV_HAS_ROLE(
          P_USERNAME  => :APP_USER,
          P_ROLE_NAME => 'ADMIN'
      );

  server-cache: 
    evaluation-point: Once per Session

  error: 
    error-message: Access Denied. You do not have permission to access this page.

