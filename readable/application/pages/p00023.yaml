- # ====== Dynamic Action: Refresh Movement Dashboard ==========
  id: 6764231037137013
  identification: 
    name: Refresh Movement Dashboard

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P23_DATE_FROM
    - P23_DATE_TO
    - P23_BRANCH_ID
    - P23_PROD_ID
    - P23_MOVEMENT_TYPE

  actions: 
  - # ====== Action: Refresh Stock Movement ======================
    id: 6764303763137014
    identification: 
      name: Refresh Stock Movement
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Stock Movement # 6757922685116339

    execution: 
      sequence: 10
      event: Refresh Movement Dashboard # 6764231037137013
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh Movement Summary ====================
    id: 6764409309137015
    identification: 
      name: Refresh Movement Summary
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Movement Summary # 6763421582137005

    execution: 
      sequence: 20
      event: Refresh Movement Dashboard # 6764231037137013
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Clear Movement Filters ==============
  id: 6764645315137017
  identification: 
    name: Clear Movement Filters

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 6764581456137016

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 6764885346137019
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // 1. Clear all filters without firing Change events
        [
            "P23_DATE_FROM",
            "P23_DATE_TO",
            "P23_BRANCH_ID",
            "P23_PROD_ID",
            "P23_MOVEMENT_TYPE"
        ].forEach(function (itemName) {
            apex.item(itemName).setValue("", null, true);
        });
        
        // 2. Refresh both regions after clearing all values
        apex.region("stock_movement_report").refresh();
        apex.region("movement_summary").refresh();

    execution: 
      sequence: 20
      event: Clear Movement Filters # 6764645315137017
      fire-when-event-result-is: True
      fire-on-initialization: false

