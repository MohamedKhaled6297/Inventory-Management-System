- # ====== Region: Products ====================================
  id: 6434932377650101
  identification: 
    name: Products
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          P.PROD_ID,
          P.PROD_NAME,
      
          C.PROD_CATG_NAME AS CATEGORY_NAME,
      
          U.UNIT_NAME AS UNIT_NAME,
      
          S.SUPPLIER_NAME AS SUPPLIER_NAME,
      
          P.PROD_MIN_STOCK,
          P.PROD_MAX_STOCK,
      
          CASE 
              WHEN P.PROD_ISACTIVE = '1' 
              THEN 'Active'
              ELSE 'Inactive'
          END STATUS,
      
          CASE 
              WHEN P.PROD_ISACTIVE = '1'
              THEN 'success'
              ELSE 'danger'
          END STATUS_COLOR,
      
          P.PROD_CR_USER,
          P.PROD_CR_DATE
      
      FROM INV_PRODUCT P
      
      LEFT JOIN INV_PRODUCT_CATG C
          ON C.PROD_CATG_ID = P.PROD_PROD_CATG_ID
      
      LEFT JOIN INV_UNITS U
          ON U.UNIT_ID = P.PROD_UNIT_ID
      
      LEFT JOIN INV_SUPPLIERS S
          ON S.SUPPLIER_ID = P.PROD_SUPPLIER_ID
      
      ORDER BY P.PROD_ID DESC;

