- # ====== Region: Depreciation Summary ========================
  id: 6847369116329210
  identification: 
    name: Depreciation Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      WITH FILTERED AS
      (
          SELECT *
          FROM HR.INV_V_DEPRECIATION_REPORT
          WHERE
              (:P35_DATE_FROM IS NULL
               OR DEPREC_ORD_DATE >=
                  TO_DATE(:P35_DATE_FROM, 'DD/MM/YYYY'))
      
          AND (:P35_DATE_TO IS NULL
               OR DEPREC_ORD_DATE <
                  TO_DATE(:P35_DATE_TO, 'DD/MM/YYYY') + 1)
      
          AND (:P35_BRANCH_ID IS NULL
               OR BRANCH_ID = :P35_BRANCH_ID)
      
          AND (:P35_PROD_ID IS NULL
               OR PROD_ID = :P35_PROD_ID)
      ),
      SUMMARY AS
      (
          SELECT
              COUNT(DISTINCT DEPREC_ORD_ID) TOTAL_ORDERS,
              NVL(SUM(QUANTITY), 0) TOTAL_QTY,
              COUNT(DISTINCT PROD_ID) TOTAL_PRODUCTS,
              COUNT(DISTINCT BRANCH_ID) TOTAL_BRANCHES
          FROM FILTERED
      )
      SELECT
          CARD_TITLE,
          CARD_VALUE,
          CARD_ICON,
          CARD_SUBTITLE,
          CARD_TYPE
      FROM
      (
          SELECT
              'Total Orders' CARD_TITLE,
              TOTAL_ORDERS CARD_VALUE,
              'fa-file-text-o' CARD_ICON,
              'Number of depreciation orders' CARD_SUBTITLE,
              'ORDERS' CARD_TYPE,
              1 SORT_ORDER
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Depreciated Qty',
              TOTAL_QTY,
              'fa-minus-circle',
              'Total depreciated units',
              'QTY',
              2
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Affected Products',
              TOTAL_PRODUCTS,
              'fa-cubes',
              'Distinct affected products',
              'PRODUCTS',
              3
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Affected Branches',
              TOTAL_BRANCHES,
              'fa-building-o',
              'Branches with depreciation',
              'BRANCHES',
              4
          FROM SUMMARY
      )
      ORDER BY SORT_ORDER
    page-items-to-submit: 
    - P35_DATE_FROM
    - P35_DATE_TO
    - P35_BRANCH_ID
    - P35_PROD_ID

  order-by: 
    type: None

