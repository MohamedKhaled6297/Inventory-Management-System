- # ====== Dynamic Action: New =================================
  id: 6848406026329221
  identification: 
    name: New

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 6848397678329220

  actions: 
  - # ====== Action: Clear Depreciation Filter ===================
    id: 6848581904329222
    identification: 
      name: Clear Depreciation Filter
      action: Execute JavaScript Code

    settings: 
      code: |
        [
            "P35_DATE_FROM",
            "P35_DATE_TO",
            "P35_BRANCH_ID",
            "P35_PROD_ID"
        ].forEach(function(itemName) {
            apex.item(itemName).setValue("", null, true);
        });
        
        var reportRegion = apex.region("depreciation_report");
        
        if (reportRegion) {
            reportRegion.refresh();
        }
        
        var summaryRegion = apex.region("depreciation_summary");
        
        if (summaryRegion) {
            summaryRegion.refresh();
        }

    execution: 
      sequence: 10
      event: New # 6848406026329221
      fire-when-event-result-is: True
      fire-on-initialization: false

