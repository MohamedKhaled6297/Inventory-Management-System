- # ====== Region: Inventory Overview ==========================
  id: 6848673629329223
  identification: 
    name: Inventory Overview
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      WITH STOCK_SUMMARY AS
      (
          SELECT
              NVL(SUM(S.STOCK_QTY), 0) AS TOTAL_STOCK,
              COUNT(DISTINCT S.STOCK_PROD_ID) AS STOCKED_PRODUCTS
          FROM HR.INV_STOCK S
      ),
      PRODUCT_SUMMARY AS
      (
          SELECT
              COUNT(*) AS ACTIVE_PRODUCTS
          FROM HR.INV_PRODUCT
          WHERE PROD_ISACTIVE = '1'
      ),
      STOCK_ALERTS AS
      (
          SELECT
              COUNT(
                  CASE
                      WHEN NVL(S.STOCK_QTY, 0) > 0
                       AND NVL(S.STOCK_QTY, 0) < NVL(P.PROD_MIN_STOCK, 0)
                      THEN 1
                  END
              ) AS LOW_STOCK,
      
              COUNT(
                  CASE
                      WHEN NVL(S.STOCK_QTY, 0) = 0
                       AND NVL(P.PROD_MIN_STOCK, 0) > 0
                      THEN 1
                  END
              ) AS OUT_OF_STOCK
      
          FROM HR.INV_BRANCHES B
          CROSS JOIN HR.INV_PRODUCT P
          LEFT JOIN HR.INV_STOCK S
              ON S.STOCK_BRANCH_ID = B.BRANCH_ID
             AND S.STOCK_PROD_ID = P.PROD_ID
      
          WHERE P.PROD_ISACTIVE = '1'
            AND B.BRANCH_ISACTIVE = '1'
      ),
      SUMMARY AS
      (
          SELECT
              S.TOTAL_STOCK,
              P.ACTIVE_PRODUCTS,
              A.LOW_STOCK,
              A.OUT_OF_STOCK
          FROM STOCK_SUMMARY S
          CROSS JOIN PRODUCT_SUMMARY P
          CROSS JOIN STOCK_ALERTS A
      )
      SELECT
          CARD_TITLE,
          CARD_VALUE,
          CARD_ICON,
          CARD_SUBTITLE,
          CARD_TYPE
      FROM
      (
          SELECT
              'Total Stock' AS CARD_TITLE,
              TOTAL_STOCK AS CARD_VALUE,
              'fa-cubes' AS CARD_ICON,
              'Total available units' AS CARD_SUBTITLE,
              'STOCK' AS CARD_TYPE,
              1 AS SORT_ORDER
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Active Products',
              ACTIVE_PRODUCTS,
              'fa-cube',
              'Active products in catalog',
              'PRODUCTS',
              2
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Low Stock Items',
              LOW_STOCK,
              'fa-exclamation-triangle',
              'Products below minimum stock',
              'LOW',
              3
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Out of Stock',
              OUT_OF_STOCK,
              'fa-times-circle',
              'Products with zero stock',
              'OUT',
              4
          FROM SUMMARY
      )
      ORDER BY SORT_ORDER

  order-by: 
    type: None

