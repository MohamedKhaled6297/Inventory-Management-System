  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          CUSTOMER_ID,
          CUSTOMER_NAME,
          CUSTOMER_PHONE,
          CASE CUSTOMER_ISACTIVE
              WHEN '1' THEN '<span class="t-Badge t-Badge--success">Active</span>'
              WHEN '0' THEN '<span class="t-Badge t-Badge--danger">Inactive</span>'
          END AS CUSTOMER_ISACTIVE,
          CUSTOMER_CR_USER,
          CUSTOMER_CR_DATE
      FROM INV_CUSTOMERS

