  inline: |
    .stock-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }
    
    .stock-badge .fa {
        font-size: 13px;
    }
    
    /* Normal Stock */
    .stock-normal {
        background: #e8f5e9;
        color: #1b5e20;
        border: 1px solid #a5d6a7;
    }
    
    /* Low Stock */
    .stock-low {
        background: #fff3e0;
        color: #e65100;
        border: 1px solid #ffcc80;
    }
    
    /* Out Of Stock */
    .stock-out {
        background: #ffebee;
        color: #b71c1c;
        border: 1px solid #ef9a9a;
    }
    
    /* Over Stock */
    .stock-over {
        background: #e3f2fd;
        color: #0d47a1;
        border: 1px solid #90caf9;
    }
    
    
    
    
    /******************************/
    /* Current Stock Summary Cards */
    
    .stock-card {
        border-radius: 12px;
        overflow: hidden;
        transition: transform .2s ease, box-shadow .2s ease;
    }
    
    .stock-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,.10);
    }
    
    /* Total Products */
    .stock-card-PRODUCTS {
        border-top: 4px solid #2196f3;
    }
    
    /* Total Quantity */
    .stock-card-QUANTITY {
        border-top: 4px solid #00acc1;
    }
    
    /* Low Stock */
    .stock-card-LOW {
        border-top: 4px solid #ff9800;
    }
    
    /* Out of Stock */
    .stock-card-OUT {
        border-top: 4px solid #f44336;
    }

