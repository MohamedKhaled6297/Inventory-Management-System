  id: 1403665235453633
  identification: 
    name: Refresh Stock Dashboard

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P30_BRANCH_ID
    - ' P30_STOCK_STATUS'

  actions: 
  - # ====== Action: Refresh =====================================
    id: 1403517003453632
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Current Stock # 907214669906549

    execution: 
      sequence: 10
      event: Refresh Stock Dashboard # 1403665235453633
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 1403480899453631
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Stock Summary # 1404267651453639

    execution: 
      sequence: 20
      event: Refresh Stock Dashboard # 1403665235453633
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Clear Stock Filters =================
  id: 1403236748453629
  identification: 
    name: Clear Stock Filters

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 1403331267453630

  actions: 
  - # ====== Action: Clear =======================================
    id: 1403185104453628
    identification: 
      name: Clear
      action: Clear

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P30_BRANCH_ID
      - P30_STOCK_STATUS

    execution: 
      sequence: 10
      event: Clear Stock Filters # 1403236748453629
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh Current Stock =======================
    id: 1403053691453627
