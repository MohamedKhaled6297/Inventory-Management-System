- # ====== Region: Order IN Summary ============================
  id: 958035146313457
  identification: 
    name: Order IN Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      WITH FILTERED AS
      (
          SELECT *
          FROM HR.INV_V_ORDER_IN_REPORT
          WHERE
              (
                  :P33_DATE_FROM IS NULL
                  OR ORDER_IN_DATE >=
                     TO_DATE(:P33_DATE_FROM, 'DD/MM/YYYY')
              )
              AND (
                  :P33_DATE_TO IS NULL
                  OR ORDER_IN_DATE <
                     TO_DATE(:P33_DATE_TO, 'DD/MM/YYYY') + 1
              )
              AND (
                  :P33_BRANCH_ID IS NULL
                  OR BRANCH_ID = :P33_BRANCH_ID
              )
              AND (
                  :P33_PROD_ID IS NULL
                  OR PROD_ID = :P33_PROD_ID
              )
      ),
      SUMMARY AS
      (
          SELECT
              COUNT(DISTINCT ORDER_IN_ID) AS TOTAL_ORDERS,
              NVL(SUM(QUANTITY), 0) AS TOTAL_QTY,
              NVL(SUM(TOTAL_VALUE), 0) AS TOTAL_AMOUNT,
              COUNT(*) AS TOTAL_LINES
          FROM FILTERED
      )
      SELECT
          CARD_TITLE,
          CARD_VALUE,
          CARD_ICON,
          CARD_SUBTITLE,
          CARD_TYPE
      FROM
      (
          SELECT
              'Total Orders' AS CARD_TITLE,
              TOTAL_ORDERS AS CARD_VALUE,
              'fa-file-text-o' AS CARD_ICON,
              'Number of receiving orders' AS CARD_SUBTITLE,
              'ORDERS' AS CARD_TYPE,
              1 AS SORT_ORDER
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Received Qty',
              TOTAL_QTY,
              'fa-cubes',
              'Total received units',
              'QTY',
              2
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Total Value',
              TOTAL_AMOUNT,
              'fa-money',
              'Total receiving value',
              'VALUE',
              3
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Order Lines',
              TOTAL_LINES,
              'fa-list',
              'Number of product lines',
              'LINES',
              4
          FROM SUMMARY
      )
      ORDER BY SORT_ORDER
    page-items-to-submit: 
    - P33_DATE_FROM
    - P33_DATE_TO
    - P33_BRANCH_ID
    - P33_PROD_ID

  order-by: 
    type: None

