- # ====== Dynamic Action: Clear Order IN Filter ===============
  id: 959104397313468
  identification: 
    name: Clear Order IN Filter

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 958763675313464

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 959286674313469
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        [
            "P33_DATE_FROM",
            "P33_DATE_TO",
            "P33_BRANCH_ID",
            "P33_PROD_ID"
        ].forEach(function (itemName) {
            apex.item(itemName).setValue("", null, true);
        });
        
        apex.region("order_in_report").refresh();
        apex.region("order_in_summary").refresh();

    execution: 
      sequence: 10
      event: Clear Order IN Filter # 959104397313468
      fire-when-event-result-is: True
      fire-on-initialization: false

