- # ====== Region: Reconciliation Summary ======================
  id: 956891491313446
  identification: 
    name: Reconciliation Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      WITH FILTERED_DATA AS
      (
          SELECT *
          FROM HR.INV_V_STOCK_RECONCILIATION
          WHERE
              (:P31_BRANCH_ID IS NULL
               OR BRANCH_ID = :P31_BRANCH_ID)
      
          AND (:P31_STATUS IS NULL
               OR RECON_STATUS = :P31_STATUS)
      ),
      SUMMARY AS
      (
          SELECT
              NVL(SUM(ACTUAL_QTY), 0) TOTAL_STOCK,
              NVL(SUM(CASE WHEN RECON_STATUS = 'MATCH'
                           THEN 1 ELSE 0 END), 0) MATCHED,
              NVL(SUM(CASE WHEN RECON_STATUS = 'MISMATCH'
                           THEN 1 ELSE 0 END), 0) MISMATCHED,
              NVL(SUM(ABS(DIFFERENCE)), 0) TOTAL_DIFFERENCE
          FROM FILTERED_DATA
      )
      SELECT
          CARD_TITLE,
          CARD_VALUE,
          CARD_ICON,
          CARD_SUBTITLE,
          CARD_TYPE
      FROM
      (
          SELECT
              'Stock Quantity' CARD_TITLE,
              TOTAL_STOCK CARD_VALUE,
              'fa-database' CARD_ICON,
              'Actual quantity in selected stock' CARD_SUBTITLE,
              'STOCK' CARD_TYPE,
              1 SORT_ORDER
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Matched Records',
              MATCHED,
              'fa-check-circle',
              'Balances matching transactions',
              'MATCH',
              2
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Mismatched Records',
              MISMATCHED,
              'fa-exclamation-triangle',
              'Balances requiring investigation',
              'MISMATCH',
              3
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Total Difference',
              TOTAL_DIFFERENCE,
              'fa-balance-scale',
              'Total absolute quantity difference',
              'DIFFERENCE',
              4
          FROM SUMMARY
      )
      ORDER BY SORT_ORDER
    page-items-to-submit: 
    - P31_BRANCH_ID
    - P31_STATUS

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

