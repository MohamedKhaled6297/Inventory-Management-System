  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 957787158313454

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 957929235313456
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        [
            "P31_BRANCH_ID",
            "P31_STATUS"
        ].forEach(function (itemName) {
            apex.item(itemName).setValue("", null, true);
        });
        
        apex.region("recon_report").refresh();
        apex.region("recon_summary").refresh();

    execution: 
      sequence: 10
      event: Clear Reconciliation Filters # 957806327313455
      fire-when-event-result-is: True
      fire-on-initialization: false

