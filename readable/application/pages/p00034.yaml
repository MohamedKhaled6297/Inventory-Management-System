- # ====== Region: Order OUT Summary ===========================
  id: 6767519184137046
  identification: 
    name: Order OUT Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      WITH FILTERED AS
      (
          SELECT *
          FROM HR.INV_V_ORDER_OUT_REPORT
          WHERE
              (:P34_DATE_FROM IS NULL
               OR ORDER_OUT_DATE >= TO_DATE(:P34_DATE_FROM, 'DD/MM/YYYY'))
      
          AND (:P34_DATE_TO IS NULL
               OR ORDER_OUT_DATE < TO_DATE(:P34_DATE_TO, 'DD/MM/YYYY') + 1)
      
          AND (:P34_BRANCH_ID IS NULL
               OR BRANCH_ID = :P34_BRANCH_ID)
      
          AND (:P34_PROD_ID IS NULL
               OR PROD_ID = :P34_PROD_ID)
      
          AND (:P34_CUSTOMER_ID IS NULL
               OR CUSTOMER_ID = :P34_CUSTOMER_ID)
      ),
      SUMMARY AS
      (
          SELECT
              COUNT(DISTINCT ORDER_OUT_ID) TOTAL_ORDERS,
              NVL(SUM(QUANTITY), 0) TOTAL_QTY,
              NVL(SUM(TOTAL_VALUE), 0) TOTAL_AMOUNT,
              COUNT(*) TOTAL_LINES
          FROM FILTERED
      )
      SELECT
          CARD_TITLE,
          CARD_VALUE,
          CARD_ICON,
          CARD_SUBTITLE,
          CARD_TYPE
      FROM
      (
          SELECT
              'Total Orders' CARD_TITLE,
              TOTAL_ORDERS CARD_VALUE,
              'fa-file-text-o' CARD_ICON,
              'Number of outgoing orders' CARD_SUBTITLE,
              'ORDERS' CARD_TYPE,
              1 SORT_ORDER
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Issued Quantity',
              TOTAL_QTY,
              'fa-arrow-up',
              'Total issued units',
              'QTY',
              2
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Total Value',
              TOTAL_AMOUNT,
              'fa-money',
              'Total outgoing value',
              'VALUE',
              3
          FROM SUMMARY
      
          UNION ALL
      
          SELECT
              'Order Lines',
              TOTAL_LINES,
              'fa-list',
              'Number of product lines',
              'LINES',
              4
          FROM SUMMARY
      )
      ORDER BY SORT_ORDER
    page-items-to-submit: 
    - P34_DATE_FROM
    - P34_DATE_TO
    - P34_BRANCH_ID
    - P34_PROD_ID
    - P34_CUSTOMER_ID

