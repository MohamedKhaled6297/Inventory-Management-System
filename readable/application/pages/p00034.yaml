  id: 6847134987329208
  identification: 
    name: Clear Order OUT Filter

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: CLEAR_FILTERS # 6847078951329207

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 6847269828329209
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        [
            "P34_DATE_FROM",
            "P34_DATE_TO",
            "P34_BRANCH_ID",
            "P34_PROD_ID",
            "P34_CUSTOMER_ID"
        ].forEach(function(itemName) {
            apex.item(itemName).setValue("", null, true);
        });
        
        apex.region("order_out_report").refresh();
        apex.region("order_out_summary").refresh();

    execution: 
      sequence: 10
      event: Clear Order OUT Filter # 6847134987329208
      fire-when-event-result-is: True
      fire-on-initialization: false

